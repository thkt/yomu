[workspace]
members = [".", "crates/recall-bench"]
default-members = ["."]
resolver = "3"

[package]
name = "yomu"
version = "0.17.0"
edition = "2024"
rust-version = "1.96"
description = "Frontend code search for AI agents"
license = "MIT"
repository = "https://github.com/thkt/yomu"

[features]
test-support = ["rurico/test-support"]

[dependencies]
# amici pins its own rurico rev; a git source resolves to one rev across the
# dependency graph, so the rurico rev below must match the one amici pins or
# the build breaks on the rev conflict. When bumping amici, align rurico to it.
amici = { git = "https://github.com/thkt/amici", rev = "5f4ee12" }
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
# Keep in lockstep with the rurico rev amici pins (see the amici note above).
rurico = { git = "https://github.com/thkt/rurico", rev = "adbe3a8" }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
strsim = "0.11"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.26"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[dev-dependencies]
rurico = { git = "https://github.com/thkt/rurico", rev = "adbe3a8", features = ["test-support"] }
tempfile = "3"
tracing-test = { version = "0.2", features = ["no-env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# absolute paths
absolute_paths = "deny"
# idiomatic iterators
cast_possible_truncation = "deny"
redundant_closure_for_method_calls = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
manual_filter_map = "deny"
manual_find_map = "deny"
# imports
wildcard_imports = "deny"
enum_glob_use = "deny"
# strings
str_to_string = "deny"
# arguments
needless_pass_by_value = "deny"
# function size: hugeness backstop at clippy's 100-line default. The
# THRESHOLDS fn<=30 target is stricter and not enforced here. Pairs with the
# file-size gate in .github/workflows/ci.yml (#255).
too_many_lines = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
